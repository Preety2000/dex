{% extends "admin/base.html" %}

{% block head %}
<style>
    .chart-container{
        display: flex;
        gap: 5px;
    }

    .charts {
        padding: 10px;
        table-layout: fixed;
        border: 1px solid var(--border);
        box-shadow: 0 1px 1px rgba(0, 0, 0, .04);
        border-spacing: 0;
        width: 50%;
        clear: both;
        background: var(--bg-muted);
        color: var(--text-title-main);
        margin: 5px auto;
    }
</style>

{% endblock %}



{% block body %}
<h2>Trending Article</h2>
<!-- {{trending}} -->
<div class="chart-container">
    <!-- <div class="tooltip"></div> -->
</div>
<table>
    <thead>
        <tr>
            <th class="manage-column check-column">No.</th>
            <th class="manage-column column-name">Article Title</th>
            <th class="manage-column column-views">Views</th>
            <th class="manage-column column-views">Likes</th>
            <th class="manage-column column-date">Publish Date</th>
        </tr>
    </thead>
    <tbody>
        {%for item in trending%}
        <tr>
            <th class="manage-column check-column">{{item.rank}}</th>
            <th class="manage-column column-name">{{item.title}}</th>
            <th class="manage-column column-views">{{item.views}}</th>
            <th class="manage-column column-views">{{item.likes}}</th>
            <th class="manage-column column-date">{{item.date}}</th>
        </tr>
        {%endfor%}
    </tbody>
</table>
<script src="/script/cdn/chart.js"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script> -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>

<script>
    //     // type: 'scatter',

    //     // type: 'radar',

                        return context.dataset.backgroundColor[context.dataIndex]; // Background color based on slice

            },

    });

{% endblock %}
