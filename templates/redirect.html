<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>redirect</title>
    <script src="/script/index.js"></script>
    <script>
        (function (r) { window.location = r.search.get("redirect") || decodeURIComponent("{{redirect or redirect_url}}").replace(/&amp;/g, '&') || r.url.origin }(new $.request()))
    </script>
</head>

<body style="display: flex;align-content: center;justify-content: center;width: 100%;height: 100%;position: absolute;left: 0;top: 0;background: var(--bg-muted);z-index: 999999;">
    <div style="max-width: 60px;max-height: 60px; display: flex;align-items: center;justify-content: center;">
        {{svg.ic_loader | safe}}
    </div>
</body>

</html>
