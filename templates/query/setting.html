<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{function.utc("Setting")}}</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">

    <!-- Meta  -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="image_src" href="/static/apple-touch-icon.png">
    <link rel="search" type="application/opensearchdescription+xml" title="{{response.site_name  | safe}}"
        href="/opensearch.xml">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{request.url}}">
    <meta property="og:site_name " content="{{response.site_name  | safe}}">
    <meta property="og:image" itemprop="image primaryImageOfPage" content="/static/apple-touch-icon@2.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:domain" content="{{response.site_domain}}">
    <meta name="twitter:title" property="og:title" itemprop="name" content="{{response.title}}">
    <meta name="twitter:description" property="og:description" itemprop="description"
        content="{{response.site_name  | safe}} | The World’s Largest Online Community for Developers">
    <meta content='#1e1e1e' name='theme-color' />

    <link rel="stylesheet" id="main_style" href="/static/css/index.css?m={{device_info.device_type}}">
    <link rel="stylesheet" id="setting" href="/static/css/setting.css?m={{device_info.device_type}}">
    <script src="/script/index.js"></script>
    <style>
        .menu-name {
            margin-left: 5px;
        }
    </style>

</head>

<body theme="{{app_context.preferences.theme}}" class="{{device_info.device_type}}">
    <div class="b_context">

                                <path d="M9 8.5a2 2 0 100-4 2 2 0 000 4zm0-1a1 1 0 110-2 1 1 0 010 2z"></path>

            </menu>
        </aside>
        <main class="IN091"></main>
    </div>
    <div class="IN013" style="display: flex;">
        <icon class="icon"></icon>
    </div>
    <script src="/script/services/setting.js"></script>
</body>

</html>
