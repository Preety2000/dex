<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Error</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .error {
      padding: 40px;
    }

    h1 {
      color: #ff3333;
      font-size: 50px;
    }

    p {
      font-size: 20px;
      color: #ccc;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background: #ff3333;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #cc0000;
    }
  </style>
</head>
<body>

  <div class="error">
    <h1>ACCESS DENIED</h1>
    <p>Wrong access type. You are not allowed to view this page.</p>
    <button onclick="history.back()">Go Back</button>
  </div>

</body>
</html>
